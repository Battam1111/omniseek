[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniseek-mcp"
version = "0.1.0"
description = "Self-hosted deep-retrieval MCP server for AI agents. Reaches what plain search can't: audio, video, logins, other languages."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = ["mcp", "deep-retrieval", "ai-agent", "llm", "rag", "citation-graph", "transcription", "web-scraping", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# CORE = the permissive-licensed, out-of-the-box engine: every benign open-API + static-scrape
# source, the recall index, document reading (minus PDF), and the shared infra. Heavy / AGPL /
# circumvention deps are OPT-IN extras below, so a bare `pip install -e .` ships Apache-clean and
# does not pull torch or an AGPL library. (Tools whose extra is absent fail-open with a clear
# "install omniseek-mcp[<extra>]" message; see asr.py / docreader.py / _cdp.py import guards.)
dependencies = [
    # MCP framework. The <2 cap is load-bearing: mcp 2.0 (2026-08) dropped mcp.server.fastmcp,
    # so an unpinned FRESH install resolves 2.x and the server dies at import. Local venvs never
    # see it (already installed); only a stranger's first build does, which is what CI's docker
    # boot job exists to catch, and did.
    "mcp[cli]>=1.0.0,<2",

    # Source adapters (API-based). arxiv + openreview use the REST API directly via omniseek.core.http, so
    # neither needs a client lib here.
    "semanticscholar>=0.10.0",
    "praw>=7.7.0",
    "atproto>=0.0.55",

    # Source adapters (web/scraping): all permissive
    "playwright>=1.40",            # chromium for the render/scrape path (Apache-2.0)
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "curl_cffi>=0.7",              # TLS/JA3 impersonation for fingerprint-walled public sites (MIT)

    # Utilities
    "pydantic>=2.5",
    "platformdirs>=4.0",
    "python-dateutil>=2.8",

    # Media metadata / captions (permissive)
    "yt-dlp>=2026.6.9",            # video/audio metadata + extractors (Unlicense); rots fast, keep current
    "youtube-transcript-api>=0.6.2",

    # Document digestion (omniseek_read_document) minus PDF: office files are zip+XML; three small pure
    # libs beat one convert-everything dep. PDF is the optional [pdf] extra (AGPL, see below).
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.0",               # downscale + contact-sheet montage for omniseek_view_doc_images

    # Recall (memory) index: the LEXICAL layer is stdlib (SQLite FTS5). The cross-lingual
    # VECTOR layer (sentence-transformers, which pulls torch) is the optional [recall] extra; absent
    # it, recall fail-opens to lexical. numpy stays in core (flat-cosine + light + broadly used).
    "numpy>=1.26",
]

[project.optional-dependencies]
# PDF reading. pymupdf is AGPL-3.0 / Artifex-commercial, kept OUT of core so the default install
# stays Apache-clean. With it absent, PDF reading (omniseek_read_document on a .pdf, the pdf source)
# degrades with a clear message; everything else works. (Follow-up: a permissive swap to
# pypdfium2 / pdfminer would fold PDF back into core.)
pdf = ["pymupdf>=1.24"]

# Audio/video transcription (omniseek_transcribe). funasr pulls torch (large); imageio-ffmpeg vendors
# an ffmpeg binary. Opt-in so a retrieval-only deployer is not forced to install torch.
asr = ["funasr>=1.0", "imageio-ffmpeg>=0.5"]

# Recall VECTOR layer (cross-lingual semantic search). sentence-transformers pulls torch (large);
# absent it, recall fail-opens to the stdlib FTS5 lexical index, so this is opt-in.
recall = ["sentence-transformers>=3.0"]

# OCR for omniseek_read_document(ocr=True): text-in-pixels (scanned pages, baked-in labels, CJK+Latin,
# CPU/keyless). rapidocr-onnxruntime pulls onnxruntime; absent it, OCR degrades with a clear message
# while the rest of document reading works.
ocr = ["rapidocr-onnxruntime>=1.2"]

# Walled / login-driven + anti-bot-signed sources (the deployer brings their own account/session).
# patchright = a stealth Playwright fork for the CDP path. xhshow = the xiaohongshu_cn request
# SIGNER (anti-bot circumvention); OPT-IN ONLY and excluded from the default source pack, see
# SECURITY.md (the circumvention/access-tier posture).
walled = ["patchright>=1.40", "xhshow>=0.1.0"]

all = ["pymupdf>=1.24", "funasr>=1.0", "imageio-ffmpeg>=0.5", "patchright>=1.40", "xhshow>=0.1.0",
       "sentence-transformers>=3.0", "rapidocr-onnxruntime>=1.2"]

[project.scripts]
omniseek-mcp = "omniseek.server:main"

[project.urls]
Homepage = "https://github.com/Battam1111/omniseek"
Repository = "https://github.com/Battam1111/omniseek"
Issues = "https://github.com/Battam1111/omniseek/issues"
Changelog = "https://github.com/Battam1111/omniseek/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Battam1111/omniseek#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniseek = ["**/*.json", "**/*.yaml"]
