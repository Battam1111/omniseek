[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniseek"
version = "0.2.1"
description = "Give your AI agent the parts of the internet web search doesn't reach: podcasts and videos, Chinese communities, and research papers. An MCP server for Claude Code, Cursor, and Codex."
requires-python = ">=3.11"
readme = {file = "docs/pypi.md", content-type = "text/markdown"}
license = "Apache-2.0"
keywords = ["mcp", "ai-agent", "claude-code", "cursor", "llm", "rag", "citation-graph", "transcription", "podcast-transcription", "bilibili", "zhihu", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# CORE = the permissive-licensed, out-of-the-box engine: every benign open-API + static-scrape
# source, the recall index, document reading (minus PDF), and the shared infra. Heavy / AGPL /
# circumvention deps are OPT-IN extras below, so a bare `pip install omniseek` ships only
# permissive licenses and does not pull torch or an AGPL library. (Tools whose extra is absent fail-open with a clear
# "install omniseek[<extra>]" message; see asr.py / docreader.py / _cdp.py import guards.)
dependencies = [
    # MCP framework. The <2 cap is load-bearing: mcp 2.0 (2026-08) dropped mcp.server.fastmcp,
    # so an unpinned FRESH install resolves 2.x and the server dies at import. Local venvs never
    # see it (already installed); only a stranger's first build does, which is what CI's docker
    # boot job exists to catch, and did.
    "mcp[cli]>=2.3.0,<3",
    # Recent anyio releases no longer depend on sniffio, so a fresh resolve leaves it out, while
    # parts of the async stack (httpcore, httpx, dnspython) still import it to detect the event
    # loop. Declared explicitly so every install has it.
    "sniffio>=1.3.1",

    # Source adapters (API-based). arxiv + openreview use the REST API directly via omniseek.core.http, so
    # neither needs a client lib here.
    "semanticscholar>=0.12.0",
    "praw>=8.0.3",
    "atproto>=0.0.72",

    # Source adapters (web/scraping): all permissive
    "playwright>=1.63.0",            # chromium for the render/scrape path (Apache-2.0)
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "feedparser>=6.0.14",
    "markdownify>=1.2.3",
    "pyyaml>=6.0.3",
    "curl_cffi>=0.16.3",              # TLS/JA3 impersonation for public sites that block plain clients (MIT)

    # Utilities
    "pydantic>=2.14.0",
    "platformdirs>=4.13.0",
    "python-dateutil>=2.9.0.post0",

    # Media metadata / captions (permissive)
    "yt-dlp>=2026.8.19",            # video/audio metadata + extractors (Unlicense); rots fast, keep current
    "youtube-transcript-api>=1.2.4",

    # Document digestion (omniseek_read, document branch) minus PDF: office files are zip+XML; three small pure
    # libs beat one convert-everything dep. PDF is the optional [pdf] extra (AGPL, see below).
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",               # downscale + contact-sheet montage for omniseek_view on documents

    # Recall (memory) index: the LEXICAL layer is stdlib (SQLite FTS5). The cross-lingual
    # VECTOR layer (sentence-transformers, which pulls torch) is the optional [recall] extra; absent
    # it, recall fail-opens to lexical. numpy stays in core (flat-cosine + light + broadly used).
    "numpy>=2.4.6",
]

[project.optional-dependencies]
# PDF reading. pymupdf is AGPL-3.0 / Artifex-commercial, kept OUT of core so the default install
# keeps only permissive licenses. With it absent, PDF reading (omniseek_read on a .pdf, the pdf source)
# degrades with a clear message; everything else works. (Follow-up: a permissive swap to
# pypdfium2 / pdfminer would fold PDF back into core.)
pdf = ["pymupdf>=1.28.2"]

# Audio/video transcription (omniseek_transcribe). funasr does NOT pull torch, and torch is
# deliberately not listed here: the default Linux torch wheel bundles CUDA and is about ten times
# the size of the CPU build, so the right wheel depends on the platform. Install torch + torchaudio
# yourself first; docs/install.md has the per-platform commands and the disk cost. imageio-ffmpeg
# vendors an ffmpeg binary.
asr = ["funasr>=1.4.16", "imageio-ffmpeg>=0.6.0"]

# Recall VECTOR layer (cross-lingual semantic search). sentence-transformers pulls torch (large);
# absent it, recall fail-opens to the stdlib FTS5 lexical index, so this is opt-in.
recall = ["sentence-transformers>=6.1.0"]

# OCR for omniseek_read(ocr=True): text-in-pixels (scanned pages, baked-in labels, CJK+Latin,
# CPU/keyless). rapidocr-onnxruntime pulls onnxruntime; absent it, OCR degrades with a clear message
# while the rest of document reading works.
ocr = ["rapidocr-onnxruntime>=1.4.4"]

# Sites behind a login + anti-bot-signed sources (the deployer brings their own account/session).
# patchright = a stealth Playwright fork for the CDP path. xhshow = the xiaohongshu_cn request
# SIGNER (anti-bot circumvention); OPT-IN ONLY and excluded from the default source pack, see
# SECURITY.md (the circumvention/access-tier posture).
walled = ["patchright>=1.63.0", "xhshow>=0.2.0"]

all = ["pymupdf>=1.28.2", "funasr>=1.4.16", "imageio-ffmpeg>=0.6.0", "patchright>=1.63.0", "xhshow>=0.2.0",
       "sentence-transformers>=6.1.0", "rapidocr-onnxruntime>=1.4.4"]

[project.scripts]
omniseek = "omniseek.server:main"

[project.urls]
Homepage = "https://github.com/Battam1111/omniseek"
Repository = "https://github.com/Battam1111/omniseek"
Issues = "https://github.com/Battam1111/omniseek/issues"
Changelog = "https://github.com/Battam1111/omniseek/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Battam1111/omniseek#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniseek = ["**/*.json", "**/*.yaml"]
