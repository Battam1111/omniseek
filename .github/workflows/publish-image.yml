name: publish-image

# Build the CORE image (Apache-clean, no extras) for amd64 + arm64 and push it to GHCR, so a
# stranger can `docker pull ghcr.io/battam1111/omniseek` instead of building locally. Runs on
# every release, or by hand from the Actions tab.

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the version tag
        id: v
        run: echo "tag=${{ github.event.release.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/battam1111/omniseek:latest
            ghcr.io/battam1111/omniseek:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.title=OmniSeek
            org.opencontainers.image.description=Self-hosted perception MCP server for AI agents. Your agent seeks what search can't find.
            org.opencontainers.image.source=https://github.com/Battam1111/omniseek
            org.opencontainers.image.licenses=Apache-2.0
            io.modelcontextprotocol.server.name=io.github.Battam1111/omniseek
          cache-from: type=gha
          cache-to: type=gha,mode=max
