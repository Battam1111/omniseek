name: Release

# Pushing a v* tag releases everything, in this order; a job that fails stops every job after it:
#   1. check     install the package and boot the server once (the same check as CI's stranger job)
#   2. build     build the sdist and wheel once; the later jobs publish exactly these files
#   3. pypi      upload them to PyPI by Trusted Publishing: GitHub proves to PyPI which repository and
#                workflow is running (OIDC), so no PyPI token is stored anywhere. A version already on
#                PyPI (uploaded by hand before the tag, or by an earlier run of this tag) is not uploaded
#                again, so the jobs after it still run
#   4. release   the GitHub Release for the tag, its notes taken from this version's CHANGELOG section
#   5. image     the amd64 + arm64 image to GHCR as v<version> and latest
#   6. registry  server.json to the official MCP Registry, logged in by GitHub OIDC
# One workflow, because an event made with the workflow's own GITHUB_TOKEN (the Release in step 4)
# does not start another workflow. PyPI comes before the Registry, which checks that the package
# server.json names exists; the image comes before the Registry, which checks the image's
# io.modelcontextprotocol.server.name label. To retry after a failure, open this run in the Actions
# tab and choose "Re-run failed jobs": GitHub re-runs them and the jobs after them, on the same tag.
#
# Before a release: the version in pyproject.toml and server.json is the tag without its "v", and
# CHANGELOG.md has a "## [<version>]" section. One-time setup on PyPI: the project's Publishing page
# lists this repository and the workflow file release.yml as a trusted publisher (no environment).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install and boot (stdio handshake + first search must return)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install .
          python scripts/stdio_stranger_probe.py

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Trusted Publishing: the OIDC token PyPI exchanges for a 15-minute upload token
    steps:
      - name: Is this version already on PyPI?
        id: onpypi
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/omniseek/${GITHUB_REF_NAME#v}/json")"
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "PyPI answered $code for omniseek ${GITHUB_REF_NAME#v}."
      - uses: actions/download-artifact@v8
        if: steps.onpypi.outputs.exists != 'true'
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.onpypi.outputs.exists != 'true'

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Take this version's notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; on = 1; next }
            on && /^## \[/ { on = 0 }
            on { print }
            END { exit !found }
          ' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/battam1111/omniseek:latest
            ghcr.io/battam1111/omniseek:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=OmniSeek
            org.opencontainers.image.description=Self-hosted MCP server that lets AI agents search podcasts and videos, Chinese communities, citation graphs, and sites behind your own login (off by default).
            org.opencontainers.image.source=https://github.com/Battam1111/omniseek
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            io.modelcontextprotocol.server.name=io.github.Battam1111/omniseek
          cache-from: type=gha
          cache-to: type=gha,mode=max

  registry:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: proves this workflow runs in Battam1111/omniseek, which grants
      contents: read    # the io.github.Battam1111/* namespace. No stored token, no device code.
    steps:
      - uses: actions/checkout@v7
      - name: Align server.json to the release
        # Sets the server and package versions and points the OCI identifier at this release's
        # image tag. OCI packages carry their version in the identifier TAG and must not have a
        # 'version' field (the registry 400s on it); only non-OCI packages get .version.
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .packages = (.packages | map(
                if .registryType == "oci"
                then .identifier = ("ghcr.io/battam1111/omniseek:" + $tag)
                else .version = $v end))
          ' server.json > server.tmp && mv server.tmp server.json
      - name: Check whether release version is already registered
        id: registry
        env:
          REGISTRY_URL: https://registry.modelcontextprotocol.io
        run: |
          set -euo pipefail
          server_name="$(jq -er '.name' server.json)"
          server_version="$(jq -er '.version' server.json)"
          registry_response="$(curl --fail-with-body --silent --show-error --get \
            --data-urlencode "search=${server_name}" \
            "${REGISTRY_URL}/v0.1/servers")"
          jq -e '(.servers | type == "array")' \
            <<<"${registry_response}" >/dev/null
          if jq -e --arg name "${server_name}" --arg version "${server_version}" \
              'any(.servers[]?; .server.name == $name and .server.version == $version)' \
              <<<"${registry_response}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Registry already contains ${server_name} version ${server_version}."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Registry does not contain ${server_name} version ${server_version}."
          fi
      - name: Skip duplicate registry version
        if: steps.registry.outputs.exists == 'true'
        run: echo "Registry publish is a no-op for the existing version."
      - name: Install mcp-publisher
        if: steps.registry.outputs.exists != 'true'
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish
