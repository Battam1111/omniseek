name: Release

# Tag-triggered release: a pushed v* tag re-runs the smoke gate, then publishes a GitHub Release
# for that tag. Keeps "tag the commit" as the only manual step and guarantees every release passed CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python tests/smoke.py
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
