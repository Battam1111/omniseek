name: Release

# Tag-triggered release: a pushed v* tag installs the package and boots the server once (the same
# check as CI's stranger job), then publishes a GitHub Release for that tag. Keeps "tag the commit"
# as the only manual step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install and boot (stdio handshake + first search must return)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install .
          python scripts/stdio_stranger_probe.py
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
