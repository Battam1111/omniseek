# OmniSeek: one-command self-host.   docker compose up -d   then point your MCP client at
# http://127.0.0.1:8765/mcp  with  Authorization: Bearer <token>  (the token is printed on first
# start; see `docker compose logs omniseek`, or read ./.omniseek/credentials/omniseek_http.json).
services:
  omniseek:
    build:
      context: .
      args:
        EXTRAS: ""          # set to "[pdf,asr,walled]" to opt into those extras (you accept their
                            # licenses, incl. AGPL PyMuPDF for [pdf]; see NOTICE)
    image: omniseek:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"   # HOST-LOOPBACK ONLY. OmniSeek drives credentialed tools, do NOT
                                # expose it to the internet; put a reverse proxy + firewall in front
                                # if you must reach it off-box, and keep the bearer token secret.
    volumes:
      - ./.omniseek:/root/.omniseek               # credentials + token + profile + cache + recall + curator state + ASR models
      - ./.omniseek-inbox:/root/omniseek-inbox    # omniseek_read_document inbox (scp/copy files here)
    environment:
      OMNISEEK_HTTP_HOST: "0.0.0.0"   # bind inside the container; the port-map above keeps it host-loopback
      # OMNISEEK_CONTACT_EMAIL: "you@example.org"   # courtesy contact for a faster lane (Crossref/SEC/Unpaywall); also quiets first-boot OpenAlex warnings (recommended)
      # OMNISEEK_ALLOW_NETS: ""                     # extra CIDRs the SSRF guard may reach (advanced)
