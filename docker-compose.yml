# OmniSeek over HTTP in Docker. Most people do not need this: the stdio install
# (uv tool install omniseek) is simpler. See docs/install.md.
#
#   docker compose up -d                                         # prebuilt image, no build
#   EXTRAS="[pdf]" docker compose --profile build up -d --build omniseek-build   # build it yourself
#
# Run one of the two services, not both: they share port 8765 and the ./.omniseek state folder.
# Then point your MCP client at http://127.0.0.1:8765/mcp with  Authorization: Bearer <token>.
# The token is printed on first start (docker compose logs) and saved to
# ./.omniseek/credentials/omniseek_http.json.

x-omniseek: &omniseek
  restart: unless-stopped
  ports:
    - "127.0.0.1:8765:8765"   # HOST-LOOPBACK ONLY. OmniSeek drives credentialed tools; do NOT
                              # expose it to the internet. Put a reverse proxy + firewall in front
                              # if you must reach it off-box, and keep the bearer token secret.
  volumes:
    - ./.omniseek:/root/.omniseek   # token, profile, credentials, cache, models, and inbox/: the files
                                    # omniseek_read reads (copy them to ./.omniseek/inbox)
  environment:
    OMNISEEK_HTTP_HOST: "0.0.0.0"   # bind inside the container; the port-map above keeps it host-loopback
    # OMNISEEK_CONTACT_EMAIL: "you@example.org"   # polite-pool fast lane for OpenAlex/Crossref/etc (recommended)
    # OMNISEEK_ALLOW_NETS: ""                     # extra CIDRs the SSRF guard may reach (advanced)

services:
  # Default: the prebuilt multi-arch image (amd64 + arm64) of this release, pulled from GitHub's registry.
  omniseek:
    <<: *omniseek
    image: ghcr.io/battam1111/omniseek:v0.3.0

  # Local build from this checkout, only with  --profile build.
  omniseek-build:
    <<: *omniseek
    profiles: ["build"]
    build:
      context: .
      args:
        EXTRAS: "${EXTRAS:-}"   # e.g. EXTRAS="[pdf,asr,walled]"; you accept those libraries' licenses
                                # (AGPL PyMuPDF for [pdf]; see NOTICE)
    image: omniseek:local
