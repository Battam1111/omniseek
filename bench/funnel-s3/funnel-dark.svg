<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 940 588" width="940" height="588" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>How the 10 cross-lingual test questions were chosen</title><desc>Thirty-three real questions were written by authors who could not see our source list. Thirty-two had an answer findable on the open web. Thirteen had one exact sentence that proves the answer and survived every check. Ten form the final test set. Between the rows, every dropped question is counted with its reason. A ten-square strip shows one verification run per final question: the answer sentence came back for one, the right page without the sentence for four, and the page was not in the top ten for five.</desc><rect width="940" height="588" fill="#0F172A"/><text x="34" y="42" font-size="20" font-weight="600" fill="#E2E8F0">How the 10 cross-lingual test questions were chosen</text><text x="34" y="68" font-size="13.5" fill="#94A3B8">The authors wrote 33 real questions without seeing our source list; the checks below cut them to 10.</text><text x="34" y="106.0" font-size="14" font-weight="600" fill="#E2E8F0">Questions written</text><rect x="34" y="118.0" width="560" height="30" rx="7" fill="#334155" opacity="0.45"/><rect x="34" y="118.0" width="560.0" height="30" rx="7" fill="#93C5FD"/><text x="610" y="139.0" font-size="18" font-weight="700" fill="#E2E8F0">33</text><text x="48" y="172.0" font-size="12.5" fill="#94A3B8">1 dropped: its author already knew the answer. 0 lacked a findable answer.</text><text x="34" y="202.0" font-size="14" font-weight="600" fill="#E2E8F0">Answers found on the open web</text><rect x="34" y="214.0" width="560" height="30" rx="7" fill="#334155" opacity="0.45"/><rect x="34" y="214.0" width="543.0" height="30" rx="7" fill="#3B82F6"/><text x="610" y="235.0" font-size="18" font-weight="700" fill="#E2E8F0">32</text><text x="48" y="268.0" font-size="12.5" fill="#94A3B8">19 dropped: no single sentence settles the question (10), the sentence changes</text><text x="48" y="286.0" font-size="12.5" fill="#94A3B8">depending on how the page is fetched (5), it also appears elsewhere (3), login required (1).</text><text x="34" y="316.0" font-size="14" font-weight="600" fill="#E2E8F0">Answers provable by one exact sentence</text><rect x="34" y="328.0" width="560" height="30" rx="7" fill="#334155" opacity="0.45"/><rect x="34" y="328.0" width="220.6" height="30" rx="7" fill="#2563EB"/><text x="610" y="349.0" font-size="18" font-weight="700" fill="#E2E8F0">13</text><text x="48" y="382.0" font-size="12.5" fill="#94A3B8">3 dropped in the final review, each with a recorded reason.</text><text x="34" y="412.0" font-size="14" font-weight="600" fill="#E2E8F0">Final test set</text><rect x="34" y="424.0" width="560" height="30" rx="7" fill="#334155" opacity="0.45"/><rect x="34" y="424.0" width="169.7" height="30" rx="7" fill="#FBBF24"/><text x="610" y="445.0" font-size="18" font-weight="700" fill="#E2E8F0">10</text><text x="34" y="494" font-size="14" font-weight="600" fill="#E2E8F0">Each final question was then run through OmniSeek once (2026-08-22):</text><rect x="34" y="510" width="24" height="24" rx="6" fill="#334155"/><text x="46.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">001</text><rect x="66" y="510" width="24" height="24" rx="6" fill="#334155"/><text x="78.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">002</text><rect x="98" y="510" width="24" height="24" rx="6" fill="#3B82F6"/><text x="110.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">003</text><rect x="130" y="510" width="24" height="24" rx="6" fill="#FBBF24"/><text x="142.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">004</text><rect x="162" y="510" width="24" height="24" rx="6" fill="#334155"/><text x="174.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">005</text><rect x="194" y="510" width="24" height="24" rx="6" fill="#3B82F6"/><text x="206.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">006</text><rect x="226" y="510" width="24" height="24" rx="6" fill="#334155"/><text x="238.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">007</text><rect x="258" y="510" width="24" height="24" rx="6" fill="#3B82F6"/><text x="270.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">008</text><rect x="290" y="510" width="24" height="24" rx="6" fill="#3B82F6"/><text x="302.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">009</text><rect x="322" y="510" width="24" height="24" rx="6" fill="#334155"/><text x="334.0" y="549" font-size="10" text-anchor="middle" fill="#94A3B8">010</text><rect x="380" y="507" width="11" height="11" rx="3" fill="#FBBF24"/><text x="398" y="517" font-size="12.5" fill="#94A3B8">Answer sentence returned (1)</text><rect x="380" y="527" width="11" height="11" rx="3" fill="#3B82F6"/><text x="398" y="537" font-size="12.5" fill="#94A3B8">Right page returned, answer sentence missing (4)</text><rect x="380" y="547" width="11" height="11" rx="3" fill="#334155"/><text x="398" y="557" font-size="12.5" fill="#94A3B8">Right page not in the top 10 (5)</text></svg>
