<line x1="662.00" y1="147.0" x2="662.00" y2="177.0" stroke="#FBBF24" stroke-width="2"/>
<text x="686" y="167.0" font-size="14" font-family="Consolas, Menlo, monospace" fill="#E2E8F0">18/18  1.0000  stale 1</text>
</g>
