<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1000" height="358" viewBox="0 0 1000 358" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>OmniSeek benchmark: pooled pass rate by suite</title>
<desc>One row per benchmark suite. The filled bar is that suite's pooled pass rate, drawn on a track that spans a pass rate of zero at its left edge to one at its right edge. The bracket across the bar spans the Wilson interval. The text on the right is passes over attempts and the rate, plus a stale count when tasks were dropped from the denominator. A suite whose required sense is not installed is drawn as a dormant row rather than as a zero bar, because a dormant sense is not a failure.</desc>
<rect x="0" y="0" width="1000" height="358" fill="#0F172A"/>
<text x="24" y="34" font-size="19" font-weight="600" fill="#E2E8F0">OmniSeek benchmark: pooled pass rate by suite</text>
<text x="24" y="58" font-size="13" fill="#94A3B8">Bar: pooled pass rate. Bracket: Wilson interval. A dormant sense is reported, not scored.</text>
<g data-suite="s3-crosslingual" data-state="measured">
<title>s3-crosslingual: pooled pass rate 0.0000, Wilson interval 0.0000 to 0.2153, 0 of 14 attempts passed, stale 1</title>
<text x="24" y="111.0" font-size="15" fill="#E2E8F0">s3-crosslingual</text>
<rect x="232" y="96.0" width="430" height="20" rx="4" fill="#334155"/>
<rect x="232" y="96.0" width="0.00" height="20" rx="4" fill="#60A5FA"/>
<line x1="232.00" y1="106.0" x2="324.59" y2="106.0" stroke="#FBBF24" stroke-width="2"/>
<line x1="232.00" y1="91.0" x2="232.00" y2="121.0" stroke="#FBBF24" stroke-width="2"/>
<line x1="324.59" y1="91.0" x2="324.59" y2="121.0" stroke="#FBBF24" stroke-width="2"/>
<text x="686" y="111.0" font-size="14" font-family="Consolas, Menlo, monospace" fill="#E2E8F0">0/14  0.0000  stale 1</text>
</g>
